<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Monkey Island Web — aifoc.us rendered as a SCUMM-style point-and-click adventure.">
  <title>Monkey Island Web — The Unshipped Essay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#scene-view">Skip to scene narration</a>
  <div id="game-container">
    <header id="site-header">
      <h1>Monkey Island Web</h1>
      <p id="subtitle">aifoc.us: “The Unshipped Essay” — a point-and-click adventure</p>
    </header>

    <main id="scene-view" aria-label="Scene narration and history" tabindex="-1">
      <!-- Narration, dialogue and history log render here (append-only) -->
    </main>
    <!-- Only the newest line is announced, so screen readers get incremental updates -->
    <div id="live-announce" class="visually-hidden" role="status" aria-live="polite"></div>

    <div id="win-banner" role="status" hidden>★ THE END — you shipped the essay. ★</div>

    <footer id="dashboard" aria-label="Game controls">
      <div id="action-line" aria-live="polite">Go to</div>
      <div id="inventory-panel" aria-label="Inventory">
        <span id="inventory-label">Inventory:</span>
        <span id="inventory-empty">(empty — talk to people, look at things)</span>
      </div>
      <div id="panels">
        <nav id="verbs-panel" aria-label="Verbs">
          <!-- Verbs generated here -->
        </nav>
        <ul id="objects-panel" role="list" aria-label="Hotspots in this scene">
          <!-- Objects/Hotspots generated here (native buttons in list items) -->
        </ul>
      </div>
      <p id="keyboard-help">Keys: <kbd>1</kbd> Look at · <kbd>2</kbd> Go to · <kbd>3</kbd> Talk to · <kbd>4</kbd> Use · <kbd>Tab</kbd>/<kbd>Enter</kbd> work everywhere</p>
    </footer>
  </div>
  <script type="module" src="ui.js"></script>
</body>
</html>
